; NFS Most Wanted (2005) gameplay mod: H-pattern shifter + clutch, engine wear, damage, popped
; tires, physics, traffic. Most settings can also be changed in game in the F4 menu.
;
; Easiest setup: in game, press F4 and bind the clutch and each gear under CONTROLS (Right, then
; press the pedal, button or key). The bindings are written below.
;
; Binding syntax (several bindings for one action: separate them with commas):
;   joy0:b12        button 12 (0-based) on device joy0
;   joy0:s0         axis: x y z rx ry rz s0 s1 (s = slider). "joy0:-s0" = pressed end is the low end
;   joy0:pov0:up    hat direction: up right down left
;   key:LSHIFT      keyboard key: A-Z 0-9 F1-F24 LSHIFT RSHIFT LCTRL RCTRL LALT RALT SPACE TAB
;                   UP DOWN LEFT RIGHT NUMPAD0-9 ... or a virtual-key code like 0x10

[General]
Enabled=1
; Switch between H-pattern and sequential shifting ([Shifter] Sequential) while driving
; (the clutch keeps working either way), e.g. Toggle=key:F9
Toggle=
; Log shifter position and clutch pedal changes to nfsmw_gameplay.log
LogInputs=0

[Devices]
; JoyN = part of the controller's name. Empty = the Nth attached controller
; (the log lists them in order: "input: joy0 = ...").
Joy0=
Joy1=

[Clutch]
; Clutch pedal axis, or buttons / keys (a digital clutch is eased in and out).
; e.g. Clutch=joy0:s0   or   Clutch=key:LSHIFT
Clutch=
; Raw axis readings with the pedal up and floored (0..65535). -1 = assume the pedal rests
; at one end of its travel when the game starts.
Released=-1
Pressed=-1
; Travel ignored at each end of the pedal
Deadzone=0.04
; Bite point, as pedal travel (0 = up, 1 = floored): while letting the pedal out the clutch
; starts to grip at BiteStart and grips fully at BiteEnd.
BiteStart=0.70
BiteEnd=0.20
; Clutch friction relative to the game's own clutch (0.1 - 2). Lower = longer, softer slip.
Strength=1.0
; Once the pedal is up, the clutch locks when engine and gearbox are within this many rpm
LockRPM=150
; Digital clutch: seconds to press it fully / to let it out fully
ButtonPressTime=0.08
ButtonReleaseTime=0.45

[Controls]
; Driving controls read by this mod and handed to the game as its own input, so the game's
; controller settings aren't needed. Easiest: bind them in the F4 menu (WHEEL AND PEDALS, CONTROLS).
; Steering axis, e.g. Steering=joy0:x ("joy0:-x" turns the other way)
Steering=
; Pedals: axes, buttons or keys. AccelerateRest / BrakeRest = raw axis value with the pedal up
; (set when binding in the menu; -1 = the end opposite to the pedal's travel)
Accelerate=
Brake=
AccelerateRest=-1
BrakeRest=-1
; Wheel rotation as set in the wheel's driver (degrees, lock to lock), and how much of it gives
; full steering in game. E.g. 900 / 540: full lock at 270 degrees each way; the force feedback
; mod puts a soft lock there.
WheelRotation=900
SteeringLock=540
; Ignored travel around the steering centre and at each end of the pedals
SteeringDeadzone=0
PedalDeadzone=0.03
; Steering response: 1 = linear; higher (e.g. 1.5) = finer steering around the centre and
; quicker towards full lock, below 1 = quicker around the centre
SteeringLinearity=1
; A bound wheel steers the car the way the game steers with a real wheel: the front wheels follow
; the wheel directly, up to full lock (45 degrees at SteeringLock), at any speed. Without this the
; game treats the wheel like a gamepad: a few degrees of lock at speed and a slow steering ramp.
; SpeedSensitivity above 0 = speed-sensitive: the lock shrinks smoothly with speed, still in
; proportion to the wheel, by this much at speed (0.85: about 19 degrees at 64 km/h, 12 at 130, 9 at
; 250, close to the game's own; lower = quicker steering at speed). 0 = off
SpeedSensitivity=0
; Steering sensitivity: multiplies how far the car steers for a given wheel angle (2 = full lock
; at half the SteeringLock, 0.5 = half the lock at the SteeringLock)
SteeringSensitivity=1
; Buttons (or keys)
Handbrake=
Nitrous=
Speedbreaker=
ResetCar=
Camera=
LookBack=
; Recentres the VR view (same as the VR mod's F8), e.g. RecenterVr=joy0:b8
RecenterVr=
; Switch ABS and traction control on / off while driving (any key or button), e.g. ToggleAbs=joy0:b9
ToggleAbs=
ToggleTc=
; Shows / hides the telemetry panel ([Telemetry])
ToggleTelemetry=key:RSHIFT
; VR seat (cockpit camera) while held, like the VR mod's numpad keys; saved per car
SeatForward=
SeatBack=
SeatLeft=
SeatRight=
SeatUp=
SeatDown=
SeatReset=
; 0 = the game ignores the controller it reads itself while driving: drive with the bindings
; above (a wheel's pedals no longer move the camera). In the game's menus MenuController and
; MenuAxes below decide. The keyboard keeps working. Needs the force feedback mod (dinput8.dll).
GameController=1
; 1 = classic input: the game reads the wheel and pedals itself (its own controller options), none
; of the steering, throttle and brake settings above apply. Shifting and the clutch stay.
ClassicInput=0
; Controller input in the game's menus only (main menu, pause, safehouse, etc.).
; 1 = buttons and d-pad work; 0 = disable all controller menu input. Driving is unaffected.
MenuController=1
; 0 = ignore analog axes in game menus so pedals and steering cannot scroll them.
; 1 = allow axes too. Both menu settings need the updated force feedback mod.
; The F4 menu's own bindings and the keyboard/mouse are unaffected.
MenuAxes=0

[Shifter]
; One binding per gate. Gates the car doesn't have (e.g. 6th in a 5-speed) act as neutral.
; Logitech G25/G27/G29/G920/G923 shifters are buttons; bind them in the F4 menu's CONTROLS.
Gear1=
Gear2=
Gear3=
Gear4=
Gear5=
Gear6=
Gear7=
Reverse=
; 1 = a gear stays selected after its button is released (button boxes, keyboard);
; Neutral= then selects neutral
Latching=0
Neutral=
; 1 = sequential shifting instead of the H-pattern: ShiftUp / ShiftDown (or the game's own shift
; controls) change gear one at a time, and RequireClutch applies to them. [General] Toggle and
; the F4 menu switch between the two while driving.
Sequential=0
ShiftUp=key:LSHIFT
ShiftDown=key:LCTRL
; Need the clutch pressed (pedal travel >= ClutchToShift) to put it in gear.
; Only applies when a clutch is bound. Pulling it out of gear never needs the clutch.
RequireClutch=1
ClutchToShift=0.60
; > 0: also allow a clutchless shift when the engine is within this many rpm of the new gear
RevMatchRPM=0
; Refuse reverse while rolling forwards, and forward gears while rolling backwards
BlockWrongDirection=1
; 1 = after a missed shift (gear refused for lack of clutch) the gear stays out even once the
; clutch is pressed: move the stick out of the gate and back in, as in a real gearbox (not with
; Latching=1)
ReselectAfterMiss=1
; 1 = keep the game's built-in shift delay even when you used the clutch
KeepShiftDelay=0
; Without the H-shifter (unbound or toggled off): shift up/down only with the clutch pressed
SequentialNeedsClutch=0
; A gear refused for lack of clutch plays a sound (a sound moment key: 0xBC2DFA2F gear grind, as
; in the intro's sabotaged BMW; 0xBAE41D1B, 0xC565AC30 totaled car; the F4 menu previews them)
; with the drag race missed-shift exhaust pop. Grind=0 or GrindSound=0 to turn off.
Grind=1
GrindSound=0xBC2DFA2F
; A gear refused for lack of clutch (a misshift) has this chance (0..1) of doing MisshiftDamage
; car damage (0.05 = 5%). Needs [Damage] Damage=1. MisshiftChance=0 to turn off.
MisshiftChance=0.5
MisshiftDamage=0.05

[Engine]
; Engine heat, over-revving and blow-ups (the drag race engine model) in every game mode.
; Only with manual shifting (H-shifter, or the game's Manual transmission setting).
; Above the redline the engine heats up; below it, it cools down. A hot engine loses power, and
; at full heat it blows: the throttle is dead until you jump to a safehouse (free roam) or
; restart the event (races). Drag races keep the game's own model.
EngineWear=1
; 0 = no rev limiter, the engine can be revved past the redline up to its max rpm (as in drag
; races). 1 = keep the limiter; sitting on it heats the engine at the HeatUp rate.
RevLimiter=0
; Heat gained per second at the redline and at max rpm (in between it scales with the rpm).
; Full heat (1.0) blows the engine: 0.05 = 20 s on the redline or at max rpm.
HeatUp=0.05
HeatUpMaxRPM=0.05
; Heat lost per second below the redline (0.01 = 100 s from full to cold)
CoolDown=0.01
; Heat at which the engine starts losing power, and the fraction of torque lost at full heat
PowerLossStart=0.9
PowerLoss=0.5
; Engine smoke from this much heat (with [Damage] Smoke on); 1 = only from damage
SmokeFrom=0.5
; Throttle at which the engine stops braking the car (0.02..1). The game blends engine braking
; out in a straight line all the way to full throttle, so the car only pulls from 25-40% throttle
; (by the car). 1 = the game's. Any gearbox, every mode.
EngineBrakingFade=0.1
; 1 = a blown engine totals the car like a drag race crash: the race ends with "Totaled" and the
; crash camera (skipped by the VR mod in the headset). 0 = the game's "Blown Engine" instead.
Totaled=1
; Testing: bindings that blow / repair the engine on the spot, e.g. DebugBlow=key:F10
DebugBlow=
DebugRepair=

[Damage]
; Collision damage for your car, shown on the HUD meter. Each impact does damage in proportion
; to the speed change it causes beyond MinImpact; at 100% the car is totaled (in free roam: jump
; to a safehouse to repair it). Props such as cones, barrels and signs do no damage. Safehouses
; and race restarts repair the car. Drag races keep the game's own model.
Damage=1
; Speed change (m/s) an impact needs before it does any damage
MinImpact=8
; Damage per m/s above that, in % (1.0 = a 20 m/s hit does 12%, a 40 m/s head-on 32%)
Strength=1.0
; A damaged engine loses power: from PowerLossStart damage, down to PowerLoss less torque at 100%
PowerLossStart=0.3
PowerLoss=0.4
; Engine smoke (the cop cars' damage smoke) from SmokeFrom damage (0.5 - 1). Its particles keep
; SmokeTrail of the car's velocity so they trail behind it at speed (0 = left hanging in the air).
Smoke=1
SmokeFrom=0.75
SmokeTrail=0.8
; Testing: binding that adds 10% damage, e.g. DebugDamage=key:F8
DebugDamage=

[Tires]
; Spike strips pop tires like in NFS Carbon: the car stays drivable with less grip and some drag.
; 0 = the game's own flat tires (locked up, the car can barely move).
PoppedTires=1
; Popped tire handicap multiplier: 1.0 = 45% less grip and a light brake drag per popped tire,
; 0.35 = about 16% less grip, 0 = no effect
Handicap=0.35
; Testing: binding that pops all four tires (repaired like damage), e.g. DebugPopTires=key:F7
DebugPopTires=

[HUD]
; The speedbreaker meter next to the tachometer shows car damage, with engine heat above HeatFrom
; overlaid in red. The meter pulses and its car icon flashes red when heat or damage reaches Warn.
Meter=1
HeatFrom=0.5
Warn=0.75
; 1 = the meter fills from the bottom up, 0 = from the top down like the speedbreaker
FillUp=1
; The car icon moved right, clear of the small arrow at the meter's end, in HUD units (about a
; pixel each at 640x480); the spike strip and engine warning icons keep their places next to it
IconShift=2
; The ABS and TC icons moved right / up from their place (HUD units, 640 wide; negative = left / down)
AidIconRight=0
AidIconUp=0
; Texture that replaces the speedbreaker clock icon, also used for the "totaled" message (falls
; back to the pause menu's car icon, then COPS_ICON, if not loaded)
Icon=INGAME_ICON_PLAYERCAR
; Engine warning icon above the car icon (the spike strip icon left of it), flashing red from
; HeatIconFrom heat or with a blown engine: the first of these textures that is loaded (ENGINE_HEAT_ICON is the
; drag HUD's, whose pack the mod loads with the race HUD's; HEAT_ICON stands in until it is there)
HeatIcon=ENGINE_HEAT_ICON,HEAT_ICON
; Engine heat (0..1) from which the engine warning icon flashes
HeatIconFrom=0.5
; ABS and TC icons above the minimap (ABS left, TC right): the first loaded texture of each list.
; They show only while that aid is on (the HUD's beige), flashing while it works.
AbsIcon=PERFORMANCE_BRAKES
TcIcon=MAIN_ICON_QUICK_RACE,MODE_ICON_QUICK_RACE
; 0 = no infractions popup, no cost to state popup, no area name on entering a neighbourhood
; ("Ocean View"); 1 = shown as the game does
Infractions=0
CostToState=0
LocationNames=0
; 0 = no speedbreaker (its meter is the damage meter now), 1 = keep it
Speedbreaker=0

[Physics]
; Your car's physics (AI and traffic keep the game's own). The game models front, rear and
; all-wheel drive properly, but its driving aids hide most of the difference; turn them down and
; RWD cars step out under power, FWD cars push wide, AWD cars stay planted.
; 0 = sliders off (the game's own physics everywhere)
Physics=1
; 1 = the pause menu's Performance Tuning acts on your car; 0 = stock values whatever it holds
GameTuning=1
; Driving aids, 1.0 = the game's own strength, 0 = off:
; traction control (cuts power to a spinning wheel while you steer)
TractionControl=0
; stability (rear grip added while the car rotates, and the drift stabiliser)
Stability=0
; drift assist (rear grip taken away once a slide starts)
DriftAssist=0
; Tire grip multiplier, every car (each keeps the game's own grip times this)
Grip=0.75
; Car character (0..1, 0 = the game's): the game gives each car its own springs, anti-roll bars,
; grip and torque but keeps them close together; this spreads them from the player cars' median,
; as (the car's / the median)^Character. Soft cars (the muscle cars) roll and dive more, stiff
; ones (the race cars) get flatter; cars with less grip than most lose some more (none gets more
; than the game gives it); cars with a lot of torque for their weight and grip step out more under
; power (FrictionCircle times up to 1.6). The anti-roll bars' front share moves further from 50%
; the same way. Downforce is Downforce's alone. The log shows each car's factors. Per car, each
; car by its own data.
Character=0.5
; 1 = each car gets its real car's weight distribution (the game puts 51-55% on the front wheels of
; every car, the 911 and the mid-engined cars too): a 911 38% front, a Lamborghini 42%, a front drive
; hatchback 62%. A car with more weight at the back than the game gave it gets a little more rear
; grip, as its wider rear tyres would.
RealWeight=1
; Grip moved between the axles: front tyres 1 + this, rear 1 - this (-0.5..0.5). Above 0 the rear
; lets go first (oversteer), below 0 the front (understeer); 0 = the game's, and best left there:
; the car's weight, springs, anti-roll bars (RollBalance) and downforce set its balance. Only for a
; real difference such as wider rear tyres
GripBalance=0
; How firm the suspension is, times the car's own (0.5..2): springs and anti-roll bars, dampers to
; match. Softer: more body roll, more nose rise under throttle and dive under braking.
SuspensionFirmness=1
; Anti-roll bar stiffness moved between the axles (-0.5..0.5): + to the front (understeer), - to the
; rear (oversteer). Only while cornering, more the harder.
RollBalance=0
; ABS: a wheel that locks under braking has its brake eased off and reapplied, so full braking
; stops the car straight (1 = on). [Controls] ToggleAbs switches it while driving.
ABS=1
; Traction control: 1 = on: the game's own at 100%, plus the throttle trimmed while the driven
; wheels spin, with launch control (a tighter limit from a standstill: launches without wheelspin).
; Off = TractionControl above. F4 > Physics > Traction control sets both. [Controls] ToggleTc switches it while driving.
TC=0
; Tyre grip on off-road surfaces: grass, dirt, mud, gravel, sand (0.2..1.0, 1.0 = as on the road)
OffroadGrip=0.95
; The tyre curve: a tyre's side grip rises with its slip angle to a peak at TyrePeakAngle (degrees,
; 3..20; road tyres about 6 to 10), then falls to TyreSlideGrip of the peak by three times that
; angle (0.5..1, 1 = the game's tyres), so a car that lets go slides on and has to be caught. The
; same in both of the game's tyre models (it switches between a gripping and a sliding one at the
; limit), so it acts the same every time. Wheels that spin or lock keep only the sideways share of
; their skid. Not on grass, dirt and other loose ground.
TyreSlideGrip=0.85
TyrePeakAngle=8
; How freely the driven wheels spin up once their tyres slide under power (0..1, 0 = the game's):
; the game keeps a sliding wheel turning nearly at road speed, so in a drift the revs stay flat.
; Higher, the wheels spin up past the limit, the revs climb and the throttle steers the slide.
; Per car, like TyrePeakAngle.
WheelspinInSlides=0.5
; Tyre grip in the rain (0.5..1.0, 0.9 = 10% less)
RainGrip=0.9
; This car's own aerodynamic downforce, times this (-0.25..2, 1 = the game's): each car keeps its
; own aero and the pause menu's aero tuning. It pushes harder the faster the car goes, so it matters
; in fast corners: lower, the car gets lighter and looser the faster it goes; below 0 it turns into
; lift. The log shows each car's own downforce.
Downforce=0.7
; While Physics=1 the downforce grows with the square of the speed, as real aero does, instead of
; the game's straight line: equal to the game's (times Downforce) at DownforceMatchSpeed, much less
; below it (a fifth at 50 km/h), a little more above (1.2x at 300 km/h). Its km/h (50..400):
DownforceMatchSpeed=250
; How much your car springs back off walls and barriers, as a share of the game's bounce (0..1).
; 0 = none: it stops at the wall or slides along it, as the game already does for head-on hits.
; Every car.
WallBounce=0
; Tyre load sensitivity (0..0.5, 0 = the game's): a tyre's grip grows less than its load, around its
; share of the car's weight. A loaded tyre (the outside one in a corner, the heavier axle, downforce)
; gets less than proportionally more grip, so weight distribution, anti-roll bars and springs set
; the balance, and downforce glues less. Every car.
LoadSensitivity=0.2
; 1 = a physics line in nfsmw_gameplay.log every second while driving (downforce, the tyre curve,
; the friction circle), and launch lines (throttle, clutch, rpm) under 30 km/h
LogPhysics=0
; Friction circle (0..1, 0 = the game's): a tyre has one grip budget for driving and cornering, so
; the share the drive torque uses is gone from cornering (a tyre using X of its grip to drive keeps
; sqrt(1 - X^2) for cornering). Full throttle in a low gear steps a rear drive car out (a front
; drive car pushes wide); at speed in a high gear little changes. Once the wheels spin, side grip
; comes back as the car slides further sideways, so a power slide can be held. Per car.
; Above 1 (up to 3) the drive torque counts that many times over: exaggerated, for testing.
FrictionCircle=1
; Gravity in g. Tire grip scales with it. GravityAllCars=1 applies it to AI and traffic too
; (they may overshoot corners at low gravity).
Gravity=1.0
GravityAllCars=0
; The fastest the car may rotate, in rad/s (8 = 1.3 turns a second; driving and spins stay under 4,
; and it keeps crashes from whirling the view around in VR). The game allows 30: a car
; spinning that fast (launched by props, landing while rotating) gets caught in a collision loop
; and is thrown around the map. 0 = the game's limit
MaxSpin=8
; The per-car values (TractionControl, Stability, DriftAssist, Grip, Gravity, GripBalance,
; OffroadGrip, TyreSlideGrip, RainGrip, Downforce, MaxSpin, SuspensionFirmness, RollBalance) can
; also come from a group or a car's own section (F4 > Physics > Settings from):
; - [Group.<name>]: the values, and Cars= the cars in it (CARS folder names, comma separated, e.g.
;   Cars=camaro,gto,mustanggt). Every car in it drives on its values; F4 > Physics > Groups adds
;   cars, renames and deletes. A car is in one group at most.
; - [Car.<name>], e.g. [Car.bmwm3gtre46]: values for that car alone. It goes before any group.
; Cars in neither use the values above. Character and RealWeight act on all of them.

; 1 = the premade groups below are in this file (an older file without groups gets them once)
PremadeGroups=1
; Premade groups (F4 > Physics > Groups): the player cars by class and drive. A car is in one
; group at most. A group without a value of its own uses the [Physics] one, so these drive as
; the shared settings until you change a value in one.
[Group.Muscle]
Cars=camaro,corvette,cts,gto,monaro,mustanggt,viper

[Group.Tuner FWD]
Cars=cobaltss,eclipsegt,gti,punto

[Group.Tuner AWD]
Cars=a3,a4,imprezawrx,lancerevo8,tt

[Group.Tuner RWD]
Cars=clio,is300,rx7,rx8,supra

[Group.Exotic RWD]
Cars=911gt2,997s,bmwm3gtr,bmwm3gtre46,carreragt,caymans,clk500,corvettec6r,db9,elise,fordgt,sl500,sl65,slr

[Group.Exotic AWD]
Cars=911turbo,gallardo,murcielago

; Drive only, for tuning by drive alone: empty to start (a car is in one group at most, so
; ticking one here takes it out of its class group above).
[Group.FWD]
Cars=

[Group.RWD]
Cars=

[Group.AWD]
Cars=

[Traffic]
; 1 = no heavy support: the SUVs a pursuit sends to ram you head-on out of oncoming traffic don't
; come. SUV patrols and SUVs in roadblocks still do. (Replaces NoSuvCops, which removed every SUV.)
NoHeavySupport=1

[Races]
; 1 = drag races without the drag mechanics for your car: you steer (no automatic lane changes),
; and the car keeps its normal engine, shifting and damage, so the wheel, shifter, engine wear and
; damage settings work. Opponents and the race itself (staging, finish) are unchanged.
NormalDragRaces=1
; 1 = drag races show the normal race HUD (tachometer, speedometer, minimap, damage meter) instead
; of the drag HUD
NormalDragHud=1

[Telemetry]
; A panel of what the car is doing, from the game's own physics: the G-force circle (the ring is
; the grip the tyres have now), each tyre's grip, the suspension's travel and the downforce.
; [Controls] ToggleTelemetry shows / hides it while driving. In VR it stays on the HUD panel, also
; with the in-car display.
Show=0
; The panel's centre, fractions of the screen from the left and from the top; its size and opacity
X=0.13
Y=0.42
Size=0.8
Opacity=1
; Seconds the needles take to follow most of a change; seconds of the G-force dot's trail
Smoothing=0.12
Trail=0.5
; The blocks shown
GForce=1
Tyres=1
Suspension=1
Downforce=1

[UI]
; Engine heat gauge (shown while engine wear is active) and its position, as fractions of the
; screen. Drawn with the HUD, so it is on the HUD panel in VR. Off by default: a placeholder
; until it is redone in the style of the game's HUD.
Gauge=0
GaugeX=0.85
GaugeY=0.64
; Size of the gauge and the tuning menu
Scale=1.0
; In-game tuning menu (engine wear, shifter and clutch settings), only while driving. Changes
; apply at once and are saved here when the menu closes. The car's controls are blocked while
; it is open. Use a wheel's d-pad for VR, e.g. MenuUp=joy0:pov0:up
; All bindings (gears, clutch, menu, ...) can also be set in the menu's CONTROLS section: Right
; adds the next key, button, hat or pedal you press, Left unbinds it (the menu's own controls
; go back to their defaults).
; 1 = the old flat menu instead of the ImGui one (sidebar, sliders, mouse on a flat screen)
ClassicMenu=0
Menu=key:F4
MenuUp=key:UP,key:NUMPAD8
MenuDown=key:DOWN,key:NUMPAD2
MenuLeft=key:LEFT,key:NUMPAD4
MenuRight=key:RIGHT,key:NUMPAD6
