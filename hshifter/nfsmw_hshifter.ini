; NFS Most Wanted (2005) H-pattern shifter + clutch mod
;
; Easiest setup: run "hshiftertool setup" in the game folder. It detects your clutch pedal and
; every shifter gate and fills in [Devices], [Clutch] and [Shifter] below.
;
; Binding syntax (several bindings for one action: separate them with commas):
;   joy0:b12        button 12 (0-based, as shown by "hshiftertool monitor") on device joy0
;   joy0:s0         axis: x y z rx ry rz s0 s1 (s = slider). "joy0:-s0" = pressed end is the low end
;   joy0:pov0:up    hat direction: up right down left
;   key:LSHIFT      keyboard key: A-Z 0-9 F1-F24 LSHIFT RSHIFT LCTRL RCTRL LALT RALT SPACE TAB
;                   UP DOWN LEFT RIGHT NUMPAD0-9 ... or a virtual-key code like 0x10

[General]
Enabled=1
; Switch between the H-shifter and the game's own sequential shifting while driving
; (the clutch keeps working either way), e.g. Toggle=key:F9
Toggle=
; Log shifter position and clutch pedal changes to nfsmw_hshifter.log
LogInputs=0

[Devices]
; JoyN = part of the controller's name. Empty = the Nth attached controller
; (order as listed by "hshiftertool list").
Joy0=
Joy1=

[Clutch]
; Clutch pedal axis, or buttons / keys (a digital clutch is eased in and out).
; e.g. Clutch=joy0:s0   or   Clutch=key:LSHIFT
Clutch=
; Raw axis readings with the pedal up and floored (0..65535). -1 = assume the pedal rests
; at one end of its travel when the game starts.
Released=-1
Pressed=-1
; Travel ignored at each end of the pedal
Deadzone=0.04
; Bite point, as pedal travel (0 = up, 1 = floored): while letting the pedal out the clutch
; starts to grip at BiteStart and grips fully at BiteEnd.
BiteStart=0.70
BiteEnd=0.20
; Clutch friction relative to the game's own clutch (0.1 - 2). Lower = longer, softer slip.
Strength=1.0
; Once the pedal is up, the clutch locks when engine and gearbox are within this many rpm
LockRPM=150
; Digital clutch: seconds to press it fully / to let it out fully
ButtonPressTime=0.08
ButtonReleaseTime=0.45

[Shifter]
; One binding per gate. Gates the car doesn't have (e.g. 6th in a 5-speed) act as neutral.
; Logitech G25/G27/G29/G920/G923 shifters are buttons; run "hshiftertool setup" to find them.
Gear1=
Gear2=
Gear3=
Gear4=
Gear5=
Gear6=
Gear7=
Reverse=
; 1 = a gear stays selected after its button is released (button boxes, keyboard);
; Neutral= then selects neutral
Latching=0
Neutral=
; Need the clutch pressed (pedal travel >= ClutchToShift) to put it in gear.
; Only applies when a clutch is bound. Pulling it out of gear never needs the clutch.
RequireClutch=1
ClutchToShift=0.60
; > 0: also allow a clutchless shift when the engine is within this many rpm of the new gear
RevMatchRPM=0
; Refuse reverse while rolling forwards, and forward gears while rolling backwards
BlockWrongDirection=1
; 1 = keep the game's built-in shift delay even when you used the clutch
KeepShiftDelay=0
; Without the H-shifter (unbound or toggled off): shift up/down only with the clutch pressed
SequentialNeedsClutch=0
