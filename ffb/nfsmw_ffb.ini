; NFS Most Wanted (2005) force feedback mod
; All strengths are 0..1 fractions of the wheel's maximum (values above 1 are allowed for Gain).

[FFB]
Enabled=1
; 1 = let the game's original force feedback through and disable this mod's effects
NativeFFB=0

; Master strength for everything below
Gain=1.0

; Steering weight from the front tyres' self-aligning torque.
SelfAligningTorque=0.75
; Front slip angle (degrees) at which the wheel is heaviest. Past it the wheel goes light,
; telling you the front is losing grip (understeer).
SlipAnglePeak=6.0
; While sliding, residual pull of the wheel toward the direction of travel (helps catch drifts)
DriftAlign=0.25

; Damping (wheel weight that resists fast movement) at standstill and at speed
DamperLowSpeed=0.35
DamperHighSpeed=0.12
; Constant friction, plus extra tyre scrub when nearly stationary
Friction=0.06
StandstillFriction=0.35

; Kicks from the front suspension (bumps, kerbs, landing jumps)
RoadFeel=0.5
; Impacts: head-on hits shake the wheel both ways, side and angled hits kick it one way
Collisions=0.8
; Vibration
EngineVibration=0.02
BrakeLockVibration=0.12

; Centring spring in menus, pause and cutscenes
MenuSpring=0.25
; Centring spring while driving, on top of the tyre forces. It grows with speed, as in a real
; car: CenterSpringParked of it at standstill (0..1), all of it from CenterSpringSpeed (km/h) up.
CenterSpring=0.25
CenterSpringParked=0.3
CenterSpringSpeed=150
; Push-back past the steering lock (the gameplay mod's [Controls] SteeringLock)
SoftLock=0.8

; Aligning torque that grows with speed and steering angle (-K * speed * sin(angle)): light when
; parked, pulls the wheel back to centre harder the faster you go. Full at SpeedCenteringRef km/h.
SpeedCentering=0.35
SpeedCenteringRef=120
; When the front tyres slide past their grip (understeer: the car turns less than the wheel says),
; the steering goes this much lighter (0.4-0.6 feels natural)
UndersteerLightening=0.5
; Rumble on rough ground (grass, dirt, gravel), from the game's own per-surface rumble values
SurfaceRumble=0.35
; Kicks from kerbs and rumble strips: a jerk in the car's own vertical motion above CurbJerk (m/s^3)
; fires a short push away from the side that hit. Hills and crests change too slowly to count.
Curbs=0.5
CurbJerk=300
; Wall scrapes and taps: pull toward the contact plus a fast rumble
Scrapes=0.4
; In the air the wheel goes limp (AirborneForce of the steering forces is left); landing jolts it
Landing=0.6
AirborneForce=0.1
; How a force to the other side is sent: 0 = negative magnitude (DirectInput standard),
; 1 = negative direction (for wheel drivers that ignore negative magnitudes)
ForceDirection=0

; Deadband compensation: raise (e.g. 0.03-0.08) if small forces don't move your wheel
MinForce=0.0
; Flip the direction of steering forces (only if the auto-detection got it wrong)
InvertForce=0
; Steering axis of your wheel: 0=X 1=Y 2=Z 3=RX 4=RY 5=RZ 6=Slider
SteerAxis=0
; Effect update rate
UpdateHz=200
; Restart this mod's wheel effects after a driver/focus issue: F10 (0 = disable the hotkey).
; Also available in the gameplay mod's F4 > Force Feedback menu. Calibration is kept.
KeyReset=0x79
; Write telemetry to nfsmw_ffb.log every 0.1 s (for tuning / bug reports)
LogTelemetry=0

[Calibration]
; Filled in automatically. Set back to 0 to re-detect.
ForceSign=0
SlipSign=0
RightSign=0
