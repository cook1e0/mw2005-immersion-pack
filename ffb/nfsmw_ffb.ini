; NFS Most Wanted (2005) force feedback mod
; All strengths are 0..1 fractions of the wheel's maximum (values above 1 are allowed for Gain).

[FFB]
Enabled=1
; 1 = let the game's original force feedback through and disable this mod's effects
NativeFFB=0

; Master strength for everything below
Gain=1.0

; Steering weight from the front tyres' self-aligning torque.
SelfAligningTorque=0.75
; Front slip angle (degrees) at which the wheel is heaviest. Past it the wheel goes light,
; telling you the front is losing grip (understeer).
SlipAnglePeak=6.0
; While sliding, residual pull of the wheel toward the direction of travel (helps catch drifts)
DriftAlign=0.25

; Damping (wheel weight that resists fast movement) at standstill and at speed
DamperLowSpeed=0.35
DamperHighSpeed=0.12
; Constant friction, plus extra tyre scrub when nearly stationary
Friction=0.06
StandstillFriction=0.35

; Kicks from the front suspension (bumps, kerbs, landing jumps)
RoadFeel=0.5
; Jolt on impacts
Collisions=0.8
; Vibration
EngineVibration=0.02
BrakeLockVibration=0.12

; Centring spring in menus, pause and cutscenes
MenuSpring=0.25

; Deadband compensation: raise (e.g. 0.03-0.08) if small forces don't move your wheel
MinForce=0.0
; Flip the direction of steering forces (only if the auto-detection got it wrong)
InvertForce=0
; Steering axis of your wheel: 0=X 1=Y 2=Z 3=RX 4=RY 5=RZ 6=Slider
SteerAxis=0
; Effect update rate
UpdateHz=200
; Write telemetry to nfsmw_ffb.log every 0.1 s (for tuning / bug reports)
LogTelemetry=0

[Calibration]
; Filled in automatically. Set back to 0 to re-detect.
ForceSign=0
SlipSign=0
RightSign=0
