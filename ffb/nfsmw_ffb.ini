; NFS Most Wanted (2005) force feedback mod
; Forces are shares of full scale (0..1). The gameplay mod's F4 menu > Force feedback has the
; strength, steering feel and effects, where changes apply live; the filters and limits below
; (MaxForce, LimitKnee, SlewRate, SmoothingHz) are set here only.

[FFB]
Enabled=1
; 1 = let the game's original force feedback through instead of this mod's
NativeFFB=0

; --- Output and safety (direct drive) --------------------------------------------------------
; Master strength
Gain=0.6
; Ceiling of the torque sent to the wheel, share of its maximum. Lower it for a strong direct
; drive base (0.6-0.8); the soft limiter keeps everything below it without clipping.
MaxForce=0.85
; Above this share of MaxForce, peaks are compressed smoothly instead of cut flat
LimitKnee=0.7
; Fastest torque change, full scale per second: no update ever hits like a hammer
SlewRate=20
; Smoothing of the forces from the game's physics steps (Hz)
SmoothingHz=25
; 1 = when the wheel starts shaking by itself, raise damping and lower the gain until it settles
OscillationGuard=1

; --- Steering forces --------------------------------------------------------------------------
; The front tyres' self-aligning torque: the wheel is pulled toward where the front axle is
; travelling. Heavy while the tyres grip, light past the limit (understeer), and it pulls into
; the countersteer in a slide.
Aligning=1.0
; Front slip angle (degrees) where the wheel is heaviest
GripPeakAngle=7
; Pull toward the direction of travel that stays when the front is sliding
DriftAlign=0.3
; How much the front tyres' load (braking, crests, dips) changes the weight
LoadSensitivity=0.5
; Spring toward centre while parked or slow, fading out by 20 km/h as the tyres' own weight
; (Aligning) takes over
Centering=0.2
; Weight against fast wheel movement (also keeps a direct drive wheel from oscillating)
Damping=0.15
; Constant resistance, plus stationary friction: tyre scrub when stopped (full at a standstill,
; gone by 18 km/h; 0..1)
Friction=0.05
ParkingFriction=0.2
; End stop at the game's steering lock (the gameplay mod's [Controls] SteeringLock)
SoftLock=1.0
; Spring in menus, pause and cutscenes
MenuCentering=0.2

; Effects (added after the force change limit, so their vibrations get through)
; Engine vibration at the engine's revs, mostly felt standing still
EngineRumble=0.05
; Jolts from hitting walls and props (benches, sign posts, fences). An impact that damages the
; car (the gameplay mod's [Damage] counts them) makes its jolt harder for a harder hit, away from
; the side that was hit, and ducks the other effects while it plays.
Crashes=0.5
; Grinding along walls, and a pull toward the wall
Scrapes=0.3
; A sharp knock when you smash a breakable prop (bench, sign post, fence, bin): the game's own
; breakable objects, told apart from other contacts
Breakables=0.4
; Vibration while the front wheels are off the road: grass, dirt, mud, gravel, sand
OffroadVibration=0.4
; A hard kick and a short shake when the car lands after a jump (stronger the longer it flew)
Landing=0.6
; The same kick and shake when you hit another vehicle (traffic, cops, racers), told apart by the
; game's own object type. Vehicle hits and breakables are at full strength from 150 km/h.
; A traffic-hit pulse temporarily ducks the other transient effects so the impact is easier to feel.
CarHits=0.6
; A fine vibration once any tyre is past its grip limit, rising with how far past it is and with
; speed (0 = off .. 0.5)
TyreScrub=0.15

; --- Wheel --------------------------------------------------------------------------------------
; Force feedback device in Windows' order (as joy.cpl lists them): 0 = the first.
; -1 = the first one the game opens
Device=0
; 1 = a positive force turns the wheel right (DirectInput's standard), -1 = left (a Fanatec CSL
; DD was measured turning left). F4 > Force feedback > Test force pushes right: if it pushes left,
; set -1 (or turn on Reverse force direction).
ForceSign=1
Reverse=0
; How a force to the left is sent: 0 = negative magnitude, 1 = negative direction
ForceDirection=0
; 1 = every change restarts the effect (DIEP_START). Fanatec bases ignore changes to a playing
; effect without it.
RestartEffects=1
; Steering axis of your wheel: 0=X 1=Y 2=Z 3=RX 4=RY 5=RZ 6=Slider
SteerAxis=0
; Force updates per second
UpdateHz=400
; Restart the wheel's force after a driver or focus problem: F10 (0 = no hotkey)
KeyReset=0
; Write the forces to nfsmw_ffb.log ten times a second (for tuning and bug reports)
LogTelemetry=0
