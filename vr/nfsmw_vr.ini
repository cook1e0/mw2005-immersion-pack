; NFS Most Wanted VR settings. Keep this file next to nfsmw_vr.asi (or d3d9.dll).
[VR]
; 0 = act as a plain d3d9.dll (no VR)
Enabled=1
; Save nfsmw_crash.dmp + nfsmw_crash.txt locally after an unhandled game crash.
; Requires nfsmw_crashdump.exe next to speed.exe. No upload; latest crash replaces the files.
CrashDumps=1
ForceWindowed=1
DisableVSync=1
; OpenXR runtimes without 32-bit support (SteamVR) run through nfsmw_vr_host.exe.
; auto = use it when the active runtime has no 32-bit version, 1 = always, 0 = never
Bridge=auto
; Load the OpenXR API layers installed on this PC (frame generation tools such as VectorXR or
; OFXR Bridge, OpenXR Toolkit, ...), like other OpenXR games do. Most are 64-bit only and load
; only with Bridge=1 (nfsmw_vr.log names them). 0 = none.
ApiLayers=1

; Per-eye render resolution: auto = headset's recommended size, game = in-game setting,
; or e.g. 2016x2112. ResolutionScale multiplies "auto" (e.g. 0.8 for more fps).
Resolution=auto
ResolutionScale=1.0

; Multiplies head movement (1.0 = real-world scale)
WorldScale=1.0
; How much of the car's body roll / pitch to remove from your view (0..1)
LevelRoll=1.0
LevelPitch=0.0
; >1.0 renders a little beyond the headset FOV (softer image, more margin)
FovScale=1.0
; Near clip plane in metres: lower it if the dashboard, wheel or pillars close to your eyes get
; cut off (the game's own is 0.5). Very small values can make distant surfaces flicker. 0 = the game's own. Also in F4 > VR.
NearZ=0.091
; In the driver's seat the depth buffer is split: your own car (cockpit, body, driver, wheel) is
; drawn with NearZ in its own small part of the depth range, the world with WorldNearZ in the rest,
; so a low NearZ no longer makes distant surfaces flicker (z-fighting). Your car is always drawn in
; front of the world. Lower WorldNearZ if another car or a wall right at your window is cut off.
; 0 = one near plane (NearZ) for everything, as before.
DepthSplit=1
WorldNearZ=0.3

; Menu/movie screen and in-game HUD panel, in metres
ScreenDistance=2.5
ScreenWidth=3.0
HudDistance=1.2
HudWidth=1.4
HudHeight=-0.05
; Sideways offset of the HUD panel in metres (+ = right)
HudRight=0

; Desktop window: smooth = stabilised headset view, sbs = both eyes side by side, eye = raw mirror
SpectatorMode=smooth
; 0 = match the headset. For 16:9 recordings try SpectatorFov=100, SpectatorAspect=1.7778
SpectatorFov=0
SpectatorAspect=0
SpectatorWidth=1600
; Head smoothing in seconds; FollowHead=0 locks the view straight ahead
SpectatorSmoothing=0.2
SpectatorFollowHead=1

; Cockpit: in the bumper and hood cameras you sit in the driver's seat (at the driver model's
; head), and the driver's head is left out of your view. HeadSize = how far down from the top of
; the driver model is cut away (m).
Seat=1
HideHead=1
; 1 = also leave out the driver's arms and hands (they don't follow your hands or the wheel)
HideArms=1
; 1 = the car's steering wheel is drawn in front of the HUD panel while driving (not in the pause
; menu, other menus or while the F4 menu is open). Live in F4 > VR.
WheelOverHud=0
; 1 = each car remembers its HUD size, distance, height and side ([Hud] section, saved a moment
; after you change them in that car). A car without its own yet starts from the mod's defaults.
; Live in F4 > VR.
HudPerCar=1
; In-car dashboard: from the seat, the HUD's parts (minimap, speedometer, cop radar, pursuit info,
; leaderboard, messages) are shown on a display over the gauge cluster behind the steering wheel and
; the floating HUD is hidden. DashRight / DashUp move it (m), DashZoom sizes it; always saved per car
; model in [Dash]. Live in F4 > VR. On a flat screen (no headset) the display is there but empty,
; and the HUD stays on the screen.
Dash=1
; Experimental, off by default (parts can still be found wrong as the HUD changes, at a race
; start or when icons appear). 1 = each part is cut from where it actually is on the HUD (near its crop, Dash<Part>L/T/R/B), so
; another HUD layout (the widescreen fix's FixHUD on, a HudAspectRatioConstraint) still fits;
; nfsmw_vr.log says where each was found. A part keeps its crop above until it has been seen whole
; (2 s without growing), then holds still there; it is saved as DashFound<Part> (delete those lines
; to find them again) and used straight away from the next start. 0 = the crops as they are (made
; for FixHUD off: if the parts are cut wrong, set FixHUD = 0 in NFSMostWanted.WidescreenFix.ini).
DashAutoCrop=0
DashRight=0
DashUp=0
DashZoom=1
; Each element's place on the dashboard (m from the gauge cluster, at zoom 1) and size (1 = the
; HUD's own scale, 0 = hidden): Map, Radar (cop radar), Speedo, Pursuit, Board (leaderboard), Msg
; (messages). Not set = automatic layout. Set them live in F4 > VR > Adjust dashboard, which saves
; them for every car in [DashLayout] Default.
;DashMapX=-0.08
;DashMapY=0
;DashMapSize=1
; F4 > VR > Triangle editor fixes car parts by hand: the car's own gauges under the display, broken
; steering wheels (look at triangles: hide, draw black, add to / take off the wheel, restore); edits
; are saved per car part in nfsmw_vr_edits.ini.
HeadSize=0.25
; The car's steering wheel turns with your wheel, by the same angle (needs the gameplay mod with a
; bound steering axis and [Controls] WheelRotation set to your wheel's rotation)
SteeringWheel=1
; Raindrops on the screen in the headset (they stick to your eyes). 0 = off, the rain itself stays.
ScreenRain=0
; The spinning direction arrow above your car (it floats right in front of you from the cockpit).
; 0 = hidden in the headset, 1 = shown. Always shown on a flat screen.
DirectionArrow=0
; The sun's glare: a white blob the game draws on the screen where the sun is. In a headset it sits
; flat on your eyes and blinds you. 0 = hidden in the headset (the sun's lens flare is off too),
; 1 = shown. Always shown on a flat screen.
SunGlare=0
; Reflections (car paint, windows) from the seat's view instead of the head's, so they sit still
; when you move your head. 0 = as the game draws them for each eye.
StableReflections=1
; Mirrors: the game's rear view mirror image on the car's rear view mirror inside, in place of the
; mirror at the top of the HUD (hidden in the headset, whatever the game's option).
; MirrorFlip: flip the image left-right. MirrorBrightness: how much light the glass reflects.
Mirrors=1
MirrorFlip=0
MirrorBrightness=1.4
; Contrast of the mirror picture (1 = as rendered). Both live in F4 > VR.
MirrorContrast=1
; Size of the image on the glass (0.5..1); the rest is a dark rim, as if set into the housing.
MirrorScale=0.88
; The game's own side mirrors show the rear view on their glass (the game draws them, with the
; rear view as the glass's texture). 0 = the game's glass (vanilla side mirrors).
GameMirrors=1
; Cars whose side mirrors stay the game's even with GameMirrors=1 (model names, comma separated,
; as the log's "mirrors:" lines show them before _KIT, e.g. BMWM3GTRE46,SLR)
GameMirrorsSkip=
; How much of the rear view each side mirror shows, from its side (0.3..1; 0.5 = half, more = wider
; and a little squeezed)
SideMirrorWidth=0.6
; Performance: the reflections' environment map is a cube of six scene renders around the car, the
; same for both eyes. Refreshing only some of its faces each frame saves most of those draws (2 = each
; face every third frame, about 24 times a second at 72 Hz; 6 = all six every frame, as the game does).
EnvMapFacesPerFrame=2
; Performance: the sun's shadow map is the largest pass (up to two thirds of all draws, rendered for
; each eye). The shadows are the same for both eyes, so the second eye reuses the first eye's map;
; the mod checks every frame that both eyes computed identical shadow matrices and turns this off
; (with a line in the log) if they ever differ. 0 = a shadow map per eye.
SharedShadows=1
; The game's physics rate (the widescreen fix's [MISC] SimRate) set to a whole multiple of the
; headset's refresh rate near 144 Hz (72 Hz -> 144: two physics steps every frame), so motion moves
; evenly. Written into the widescreen fix's ini once the headset's rate is known; from the next start.
; 0 = leave SimRate alone.
SimRateFromHeadset=1
; Performance: how much ground around you the shadow map covers (1 = the game's ~350 m square, 0.75
; = ~260 m; 0.3..1). Fewer objects cast shadows into it and the shadows get sharper; beyond it the
; world has no shadows.
ShadowArea=0.75
; Picture: anisotropic filtering of the game's textures (sharp road and walls at an angle). Also in
; F4 > Menu and testing, with the shadow resolution (which the widescreen fix sets: ShadowsRes).
; Anisotropic: 0 off, 1 2x, 2 4x, 3 8x, 4 16x.
Anisotropic=0
; Performance: hand each finished frame to the headset without waiting for the hand-over (saves
; about a millisecond a frame on the 64-bit bridge used with SteamVR). 0 = wait, as before.
AsyncSubmit=1
; Performance: render the rear view (the side and interior mirrors) every Nth frame (1 = every frame;
; 2 halves its cost, and the mirror picture then updates at half the headset rate).
RearViewEvery=1
; Debug: every 5 s, list how often the game binds each render target in one frame (a pass drawn for
; both eyes shows twice) and how many draws each one takes. Costs a query per binding, so it is off
; by default.
;LogPasses=1

; Virtual-key codes: F6 = 117, F7 = 118, F8 = 119
KeySpectator=117
KeyLevel=118
KeyRecenter=119
; Debug: pressing this key (F9 = 120) writes the left/right/HUD images to vr_dump_NNN_*.bmp next to
; speed.exe
;KeyDump=120
; Debug: pressing this key (e.g. Delete = 46) records 30 s of frames, one line each (phase times,
; GPU time per eye, draws, physics steps, reflection faces, shadow sharing), to
; nfsmw_frametrace_NNN.csv next to speed.exe. 0 = off
KeyTrace=0
; Performance: the game's render thread registered as a "Games" multimedia task and the system timer
; at 1 ms, so it is scheduled on time. 0 = off
RenderPriority=1
; Debug key (F11 = 122): flips, live, which views the second eye reuses instead of rendering
;KeyToggleShared=122
; Seat adjustment (held), saved per car in [Seat] below: numpad 8/2 forward/back, 4/6 left/right,
; 9/3 up/down, 5 back to the driver's head
KeySeatForward=104
KeySeatBack=98
KeySeatLeft=100
KeySeatRight=102
KeySeatUp=105
KeySeatDown=99
KeySeatReset=101

